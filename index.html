<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор сборки</title>
    <meta name="theme-color" content="#007aff">
    
    <!-- ВРЕМЕННО ОТКЛЮЧАЕМ SERVICE WORKER ДЛЯ СБРОСА КЭША -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        if (window.caches) {
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
        }
    </script>

    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .app {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            background: #007aff;
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; margin: 0; }
        .header button {
            padding: 8px 12px;
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .content { padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .input-group input[type="text"], .input-group input[type="number"] {
            width: 100%;
            padding: 13px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
        }
        .input-group input:focus { outline: none; border-color: #007aff; }
        .hint { font-size: 12px; color: #999; margin-top: 4px; }
        
        .services {
            margin: 20px 0;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
        }
        .category { border-bottom: 2px solid #f0f0f0; }
        .category:last-child { border-bottom: none; }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: #007aff;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .category-header .arrow { transition: transform 0.2s; font-size: 12px; }
        
        .category .category-header .arrow { transform: rotate(-90deg); }
        .category .service-item { display: none !important; }
        
        .category.open .category-header .arrow { transform: rotate(0deg); }
        .category.open .service-item { display: flex !important; }

        .category-count {
            background: #ccc;
            color: white;
            border-radius: 10px;
            padding: 1px 8px;
            font-size: 11px;
            margin-left: 8px;
            transition: background 0.2s;
        }
        .service-item {
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f5f5f5;
            gap: 8px;
            background: white;
        }
        .service-item:last-child { border-bottom: none; }
        .service-name { flex: 1; font-size: 13px; line-height: 1.3; }
        .service-price { font-weight: bold; min-width: 65px; text-align: right; font-size: 13px; }
        
        .counter-input {
            width: 55px !important;
            padding: 6px !important;
            font-size: 14px !important;
            text-align: center;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-weight: bold;
            outline: none;
            background: #fff;
        }
        .counter-input:focus {
            border-color: #007aff;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid #007aff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .checkbox.checked { background: #007aff; }
        .checkbox.checked::after { content: "✓"; color: white; font-weight: bold; font-size: 14px; }
        
        button.main-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #34c759, #2dbd58);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
        }
        button.reset-btn {
            width: 100%;
            padding: 11px;
            background: #ff3b30;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        button.print-btn, button.share-btn {
            width: 100%;
            padding: 13px;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button.print-btn { background: #007aff; }
        button.share-btn { background: #25d366; }
        .result {
            background: #f8f9fa;
            padding: 22px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
        }
        .selected-badge {
            display: inline-block;
            background: #007aff;
            color: white;
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .total {
            font-size: 38px;
            font-weight: bold;
            color: #007aff;
            margin: 8px 0;
        }
        .details {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }
        .details .line { display: flex; justify-content: space-between; padding: 3px 0; }
        .details .line.selected { color: #007aff; }
        .print-header {
            display: none;
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #007aff;
        }
        .print-header h2 { color: #007aff; font-size: 20px; margin-bottom: 4px; }
        .print-header .meta { color: #666; font-size: 12px; line-height: 1.5; }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 22px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 { margin-bottom: 12px; color: #333; font-size: 18px; }
        .history-item {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item .date { color: #999; font-size: 11px; }
        .history-item .sum { font-weight: bold; color: #007aff; }
        .modal-actions { display: flex; gap: 10px; margin-top: 12px; }
        .modal-actions button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-close { background: #007aff; color: white; }
        .btn-clear { background: #ff3b30; color: white; }

        .search-mode .category .service-item { display: none !important; }
        .search-mode .category .service-item.visible { display: flex !important; }
        .search-mode .category-header { display: none; }

        @media print {
            body { background: white; padding: 0; }
            .app { max-width: 100%; box-shadow: none; border-radius: 0; }
            .header, .input-group, .services, .main-btn, .reset-btn,
            .print-btn, .share-btn, .modal, .selected-badge {
                display: none !important;
            }
            .content { padding: 0; }
            .result { display: block !important; background: white; padding: 0; border-radius: 0; margin-top: 0; }
            .print-header { display: block; }
            .total { font-size: 32px; color: #000; }
            .details { color: #000; border-top: 1px solid #999; }
            .details .line.selected { color: #000; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>🪛 Калькулятор</h1>
            <button onclick="openHistory()">История</button>
        </div>

        <div class="content">
            <div class="input-group">
                <label>Стоимость мебели (руб)</label>
                <input type="number" id="price" placeholder="50000" value="50000" min="0" step="1000">
            </div>
            <div class="input-group">
                <input type="text" id="search" placeholder="🔍 Поиск услуги...">
            </div>
            <div class="services" id="services"></div>
            <div class="input-group">
                <label>Выезд (км от ЕКАД)</label>
                <input type="number" id="km" placeholder="0" value="0" min="0">
                <div class="hint">Бесплатно до 10 км, далее 40 ₽/км</div>
            </div>
            <button class="main-btn" onclick="calculateAndSave()">РАССЧИТАТЬ</button>
            <button class="reset-btn" onclick="resetAll()">СБРОСИТЬ ВСЁ</button>
            
            <div class="result" id="result" style="display: none;">
                <div class="print-header">
                    <h2>🪛 Калькулятор сборки</h2>
                    <div class="meta" id="printMeta"></div>
                </div>
                <div class="selected-badge" id="selectedBadge">Выбрано услуг: 0</div>
                <div>ИТОГО К ОПЛАТЕ</div>
                <div class="total" id="total">0 руб</div>
                <div class="details" id="details"></div>
                <button class="print-btn" onclick="printResult()">🖨 ПЕЧАТЬ / PDF</button>
                <button class="share-btn" onclick="shareResult()">📱 ОТПРАВИТЬ В WHATSAPP</button>
            </div>
        </div>
    </div>

    <div class="modal" id="historyModal">
        <div class="modal-content">
            <h2>История расчетов</h2>
            <div id="historyList"></div>
            <div class="modal-actions">
                <button class="btn-clear" onclick="clearHistory()">Очистить</button>
                <button class="btn-close" onclick="closeHistory()">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const ASSEMBLY_PERCENT = 0.12;
        const MIN_ASSEMBLY = 3000;
        const FREE_KM = 10;
        const KM_PRICE = 40;

        const categories = [
            { title: "Мойка", services: [
                {name: "Вырез под мойку в столешнице", price: 1500, qty: true},
                {name: "Монтаж нержавеющей мойки", price: 1000},
                {name: "Монтаж каменной мойки", price: 1400},
                {name: "Подключение мойки (слив/сифон)", price: 800}
            ]},
            { title: "Смеситель", services: [
                {name: "Монтаж смесителя с подключением", price: 1200},
                {name: "Вырез отверстия в столешнице под смеситель", price: 500, qty: true},
                {name: "Вырез отверстия в пластиковой столешнице под воду", price: 500, qty: true},
                {name: "Вырез отверстия в каменной столешнице под воду", price: 1000, qty: true},
                {name: "Монтаж ИПО с подключением", price: 4500},
                {name: "Монтаж питьевого фильтра с подключением", price: 4000}
            ]},
            { title: "Варочная панель", services: [
                {name: "Вырез под варочную панель в пластиковой столешнице", price: 1500, qty: true},
                {name: "Вырез под варочную панель в каменной столешнице", price: 2500, qty: true},
                {name: "Монтаж варочной панели (без подключения)", price: 1000},
                {name: "Подключение варочной поверхности", price: 500}
            ]},
            { title: "Духовой шкаф / СВЧ", services: [
                {name: "Монтаж духового шкафа (без подключения)", price: 1000},
                {name: "Подключение духового шкафа", price: 500},
                {name: "Монтаж СВЧ (без подключения)", price: 1500},
                {name: "Подключение СВЧ", price: 500}
            ]},
            { title: "Вытяжка", services: [
                {name: "Монтаж встроенной или подвесной вытяжки", price: 2000},
                {name: "Подключение вытяжки к воздуховоду", price: 1000},
                {name: "Протяжка воздуховода (гофры)", price: 700, meter: true}
            ]},
            { title: "Техника", services: [
                {name: "Монтаж ПММ с подключением", price: 2500},
                {name: "Монтаж стиральной машины с подключением", price: 2500},
                {name: "Монтаж встраиваемого холодильника/холодильной камеры", price: 3500}
            ]},
            { title: "Электрика и свет", services: [
                {name: "Разводка электрики (проводов)", price: 150, meter: true},
                {name: "Подключение светильника", price: 600},
                {name: "Врезка светильника", price: 500},
                {name: "Монтаж накладного светильника", price: 500},
                {name: "Монтаж розетки", price: 350, qty: true},
                {name: "Вырез под розетку в керамограните", price: 500, qty: true},
                {name: "Вырез под розетку в ЛДСП", price: 250, qty: true},
                {name: "Выпил в стеновой панели под электрику", price: 350, qty: true},
                {name: "Монтаж диодной подсветки", price: 700, meter: true},
                {name: "Подключение диодной подсветки", price: 1200}
            ]},
            { title: "Столешницы и панели", services: [
                {name: "Монтаж стеновой панели клиента", price: 4000},
                {name: "Монтаж столешницы клиента (пластик)", price: 5000},
                {name: "Выпил стеновой панели", price: 250, qty: true},
                {name: "Выпил подоконника", price: 3000, qty: true},
                {name: "Монтаж плитки", price: 3000, meter: true}
            ]},
            { title: "Доп. работы", services: [
                {name: "Нанесение герметика", price: 300, meter: true},
                {name: "Выпил в корпусе кухни или подгонка МДФ/ЛДСП панели", price: 350, qty: true},
                {name: "Выпил под трубы в столешнице", price: 350, qty: true},
                {name: "Переделка модуля", price: 1500},
                {name: "Монтаж ручек", price: 100, qty: true},
                {name: "Монтаж сушилки усиленной", price: 300},
                {name: "Монтаж рейлинга", price: 1000, meter: true},
                {name: "Монтаж барной трубы", price: 500},
                {name: "Монтаж напольного плинтуса клиента (мин. метр)", price: 800, meter: true},
                {name: "Демонтаж плинтуса напольного клиента (мин. метр)", price: 800, meter: true}
            ]}
        ];

        const allServices = [];
        categories.forEach(cat => {
            cat.services.forEach(s => {
                s.category = cat.title;
                s.index = allServices.length;
                allServices.push(s);
            });
        });

        function loadServices() {
            const container = document.getElementById('services');
            container.innerHTML = '';
            categories.forEach((cat, catIdx) => {
                const catDiv = document.createElement('div');
                catDiv.className = 'category';
                catDiv.id = 'category-' + catIdx;
                
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `<span>${cat.title} <span class="category-count" id="catcount-${catIdx}">0</span></span><span class="arrow">▼</span>`;
                header.onclick = () => toggleCategory(catIdx);
                catDiv.appendChild(header);
                
                cat.services.forEach(service => {
                    const idx = service.index;
                    const div = document.createElement('div');
                    div.className = 'service-item';
                    div.id = 'service-' + idx;
                    
                    if (service.meter || service.qty) {
                        const inputType = service.meter ? 'number' : 'text';
                        const inputMode = service.meter ? '' : 'inputmode="numeric"';
                        const placeholder = service.meter ? "м" : "шт";
                        
                        div.innerHTML = `
                            <div class="service-name">${service.name} ${service.meter ? '(п.м.)' : ''}</div>
                            <input type="${inputType}" ${inputMode} class="counter-input" id="val-${idx}" placeholder="${placeholder}" oninput="updateVal(${idx})">
                            <span class="service-price" id="price-${idx}">0 руб</span>
                            <div class="checkbox" id="cb-${idx}" onclick="toggleService(${idx})"></div>`;
                    } else {
                        div.innerHTML = `
                            <div class="service-name">${service.name}</div>
                            <div class="service-price">${service.price} руб</div>
                            <div class="checkbox" id="cb-${idx}" onclick="toggleService(${idx})"></div>`;
                    }
                    catDiv.appendChild(div);
                });
                container.appendChild(catDiv);
            });
            restoreDraft();
        }

        function toggleCategory(catIdx) {
            document.getElementById('category-' + catIdx).classList.toggle('open');
        }

        function updateVal(index) {
            const service = allServices[index];
            const valEl = document.getElementById('val-' + index);
            const priceEl = document.getElementById('price-' + index);
            const cb = document.getElementById('cb-' + index);
            
            let val = parseFloat(valEl.value);
            if (isNaN(val) || val < 0) val = 0;
            
            if (service.qty && val > 0 && val % 1 !== 0) {
                val = Math.floor(val);
                valEl.value = val; 
            }
            
            const totalPrice = Math.round(val * service.price);
            priceEl.textContent = totalPrice > 0 ? totalPrice + ' руб' : '0 руб';
            
            if (val > 0) cb.classList.add('checked');
            else cb.classList.remove('checked');
            
            calculate();
            saveDraft();
        }

        function toggleService(index) {
            const cb = document.getElementById('cb-' + index);
            const service = allServices[index];
            cb.classList.toggle('checked');
            
            const valEl = document.getElementById('val-' + index);
            if (service.meter || service.qty) {
                if (cb.classList.contains('checked')) {
                    if (!valEl.value || parseFloat(valEl.value) <= 0) {
                        valEl.value = '1';
                        updateVal(index);
                    }
                } else {
                    valEl.value = '';
                    updateVal(index);
                }
            }
            calculate();
            saveDraft();
        }

        function calculate() {
            let price = parseInt(document.getElementById('price').value) || 0;
            if (price < 0) price = 0;
            let assembly = Math.round(price * ASSEMBLY_PERCENT);
            if (assembly < MIN_ASSEMBLY && price > 0) assembly = MIN_ASSEMBLY;
            let extra = 0;
            const selectedList = [];
            const perCategory = {};
            
            document.querySelectorAll('.checkbox.checked').forEach(cb => {
                const idx = parseInt(cb.id.replace('cb-', ''));
                const service = allServices[idx];
                if (!service) return;
                
                let sum = 0, text = '';
                if (service.meter) {
                    const valEl = document.getElementById('val-' + idx);
                    const val = parseFloat(valEl.value) || 0;
                    sum = Math.round(val * service.price);
                    if (sum > 0) text = `${service.name} — ${val} м × ${service.price} = ${sum} руб`;
                } else if (service.qty) {
                    const valEl = document.getElementById('val-' + idx);
                    const val = parseInt(valEl.value) || 0;
                    sum = val * service.price;
                    if (sum > 0) text = `${service.name} — ${val} шт × ${service.price} = ${sum} руб`;
                } else {
                    sum = service.price;
                    text = `${service.name} — ${service.price} руб`;
                }
                
                if (sum > 0) {
                    extra += sum;
                    selectedList.push(text);
                    perCategory[service.category] = (perCategory[service.category] || 0) + 1;
                }
            });
            
            let km = parseInt(document.getElementById('km').value) || 0;
            if (km < 0) km = 0;
            const travel = Math.max(0, km - FREE_KM) * KM_PRICE;
            const total = assembly + extra + travel;

            document.getElementById('total').textContent = total.toLocaleString('ru-RU') + ' руб';
            document.getElementById('selectedBadge').textContent = 'Выбрано услуг: ' + selectedList.length;

            categories.forEach((cat, catIdx) => {
                const count = perCategory[cat.title] || 0;
                const badge = document.getElementById('catcount-' + catIdx);
                badge.textContent = count;
                badge.style.background = count ? '#34c759' : '#ccc';
            });

            let detailsHTML = `<div class="line"><span>Сборка (12%):</span> <b>${assembly.toLocaleString('ru-RU')} руб</b></div>`;
            if (selectedList.length) {
                detailsHTML += `<div style="margin-top:8px; font-weight:600; color:#333;">Доп. работы:</div>`;
                selectedList.forEach(item => {
                    detailsHTML += `<div class="line selected"><span>• ${item}</span></div>`;
                });
            } else {
                detailsHTML += `<div class="line"><span>Доп. работы:</span> <b>0 руб</b></div>`;
            }
            detailsHTML += `<div class="line" style="margin-top:6px;"><span>Выезд (${km} км от ЕКАД):</span> <b>${travel.toLocaleString('ru-RU')} руб</b></div>`;
            document.getElementById('details').innerHTML = detailsHTML;
            document.getElementById('result').style.display = 'block';

            const metaParts = ['Дата: ' + new Date().toLocaleString('ru-RU')];
            document.getElementById('printMeta').innerHTML = metaParts.join('<br>');

            return { total, assembly, extra, travel, selectedList, km };
        }

        function filterServices() {
            const q = document.getElementById('search').value.toLowerCase().trim();
            const container = document.getElementById('services');
            const items = document.querySelectorAll('.service-item');
            
            if (q.length > 0) {
                container.classList.add('search-mode');
                items.forEach(item => {
                    const text = item.querySelector('.service-name').textContent.toLowerCase();
                    if (text.includes(q)) item.classList.add('visible');
                    else item.classList.remove('visible');
                });
            } else {
                container.classList.remove('search-mode');
                items.forEach(item => item.classList.remove('visible'));
            }
        }

        function saveDraft() {
            const draft = {
                price: document.getElementById('price').value,
                km: document.getElementById('km').value,
                checked: [], vals: {}
            };
            document.querySelectorAll('.checkbox.checked').forEach(cb => {
                const idx = cb.id.replace('cb-', '');
                draft.checked.push(idx);
                const valEl = document.getElementById('val-' + idx);
                if (valEl) draft.vals[idx] = valEl.value;
            });
            localStorage.setItem('calcDraft', JSON.stringify(draft));
        }

        function restoreDraft() {
            const raw = localStorage.getItem('calcDraft');
            if (!raw) return;
            try {
                const d = JSON.parse(raw);
                if (d.price) document.getElementById('price').value = d.price;
                if (d.km) document.getElementById('km').value = d.km;
                
                if (d.vals) Object.keys(d.vals).forEach(idx => {
                    const valEl = document.getElementById('val-' + idx);
                    if (valEl) {
                        valEl.value = d.vals[idx];
                        updateVal(parseInt(idx));
                    }
                });
                
                if (d.checked) d.checked.forEach(idx => {
                    const cb = document.getElementById('cb-' + idx);
                    if (cb) cb.classList.add('checked');
                });
                calculate();
            } catch (e) { console.warn('Draft restore error', e); }
        }

        function saveToHistory(total) {
            let history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
            history.unshift({ date: new Date().toLocaleString('ru-RU'), total: total });
            if (history.length > 20) history = history.slice(0, 20);
            localStorage.setItem('calcHistory', JSON.stringify(history));
        }

        function openHistory() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
            if (!history.length) {
                list.innerHTML = '<p style="color:#999; text-align:center; padding:15px 0;">История пуста</p>';
            } else {
                list.innerHTML = history.map(h => `
                    <div class="history-item">
                        <span class="date">${h.date}</span>
                        <span class="sum">${h.total.toLocaleString('ru-RU')} руб</span>
                    </div>`).join('');
            }
            document.getElementById('historyModal').classList.add('open');
        }

        function closeHistory() { document.getElementById('historyModal').classList.remove('open'); }
        function clearHistory() {
            if (!confirm('Очистить всю историю?')) return;
            localStorage.removeItem('calcHistory');
            openHistory();
        }

        function calculateAndSave() {
            calculate();
            const total = parseInt(document.getElementById('total').textContent.replace(/\D/g, '')) || 0;
            saveToHistory(total);
        }

        function resetAll() {
            if (!confirm('Сбросить всё? Черновик будет удалён.')) return;
            document.getElementById('price').value = 50000;
            document.getElementById('km').value = 0;
            document.getElementById('search').value = '';
            document.getElementById('services').classList.remove('search-mode');
            document.querySelectorAll('.checkbox.checked').forEach(cb => cb.classList.remove('checked'));
            document.querySelectorAll('.counter-input').forEach(inp => inp.value = '');
            document.querySelectorAll('.service-price').forEach(el => el.textContent = '0 руб');
            document.querySelectorAll('.category').forEach(c => c.classList.remove('open')); 
            document.querySelectorAll('.service-item').forEach(item => item.classList.remove('visible'));
            document.getElementById('result').style.display = 'none';
            localStorage.removeItem('calcDraft');
        }

        function printResult() {
            const data = calculate();
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            if (isMobile) downloadPDF(data);
            else window.print();
        }

        async function downloadPDF(data) {
            const { total, assembly, extra, travel, selectedList, km } = data;
            const btn = document.querySelector('.print-btn');
            const oldText = btn.textContent;
            btn.textContent = '⏳ Генерация...';
            btn.disabled = true;

            try {
                const fontUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.66/fonts/Roboto/Roboto-Regular.ttf';
                const response = await fetch(fontUrl);
                const fontBuffer = await response.arrayBuffer();
                let binary = '';
                const bytes = new Uint8Array(fontBuffer);
                for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                const fontBase64 = window.btoa(binary);

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.addFileToVFS('Roboto-Regular.ttf', fontBase64);
                doc.addFont('Roboto-Regular.ttf', 'Roboto', 'normal');
                doc.setFont('Roboto');

                doc.setFontSize(18);
                doc.setTextColor(0, 122, 255);
                doc.text('КАЛЬКУЛЯТОР СБОРКИ', 105, 20, { align: 'center' });

                doc.setFontSize(10);
                doc.setTextColor(100, 100, 100);
                let y = 30;
                doc.text('Дата: ' + new Date().toLocaleString('ru-RU'), 14, y);
                y += 10;

                doc.setFontSize(12);
                doc.setTextColor(0, 0, 0);
                doc.text('ИТОГО К ОПЛАТЕ:', 14, y);
                doc.setFontSize(18);
                doc.setFont('Roboto', 'bold');
                doc.text(total.toLocaleString('ru-RU') + ' руб', 14, y + 8);
                doc.setFont('Roboto', 'normal');
                y += 20;

                doc.setFontSize(11);
                doc.text('Состав расчёта:', 14, y); y += 6;
                doc.setFontSize(10);
                doc.text('Сборка (12%): ' + assembly.toLocaleString('ru-RU') + ' руб', 14, y); y += 6;
                doc.text('Доп. работы: ' + extra.toLocaleString('ru-RU') + ' руб', 14, y); y += 6;
                doc.text('Выезд (' + km + ' км от ЕКАД): ' + travel.toLocaleString('ru-RU') + ' руб', 14, y); y += 10;

                if (selectedList.length) {
                    doc.text('Дополнительные работы:', 14, y); y += 6;
                    selectedList.forEach(item => {
                        const lines = doc.splitTextToSize('• ' + item, 180);
                        doc.text(lines, 14, y);
                        y += (lines.length * 5);
                    });
                } else {
                    doc.text('Дополнительные работы: не выбраны', 14, y);
                }

                doc.save('raschet-sborki-' + Date.now() + '.pdf');
            } catch (err) {
                console.error('PDF Error:', err);
                alert('Ошибка при создании PDF. Проверьте интернет.');
            } finally {
                btn.textContent = oldText;
                btn.disabled = false;
            }
        }

        function shareResult() {
            calculate();
            const total = document.getElementById('total').textContent;
            const details = document.getElementById('details').innerText;
            let text = '🪛 Расчёт сборки мебели\n\n' + details + '\n\nИТОГО: ' + total;
            window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
        }

        ['price', 'km'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => { calculate(); saveDraft(); });
        });
        document.getElementById('search').addEventListener('input', filterServices);

        loadServices();
    </script>
</body>
</html>
